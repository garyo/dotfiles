# espanso configuration file - garyo@oberbrunner.com ★
name: symbols
parent: default

matches:
  # emoji/symbols
  - trigger: ":check"
    replace: "✓"
  - trigger: ":chk2"
    replace: "☑"
  - trigger: ":bigx"
    replace: "❌"
  - trigger: ":excl"
    replace: "❗"
  - trigger: ":bullet"
    replace: "•"
  - trigger: ":smile"
    replace: "☺"
  - trigger: ":heart"
    replace: "♡"
  - trigger: ":question"
    replace: "❓"
  - trigger: ":star:"
    replace: "★"
  - trigger: ":fire"
    replace: "🔥"
  - trigger: ":yen"
    replace: "¥"
  - trigger: ":gbp"
    replace: "£"
  - trigger: ":euro"
    replace: "€"
  - trigger: ":->"
    replace: "→"
  - trigger: ":<-"
    replace: "←"
  - trigger: ":=>"
    replace: "⇒"
  - trigger: ":<="
    replace: "⇐"
  - trigger: ":arrow"
    replace: "⮕"
  - trigger: ":darrow"
    replace: "↔"
  - trigger: ":---"
    replace: "—"
  - trigger: ":--:"
    replace: "–"
  - trigger: ":up:"
    replace: "↑"
  - trigger: ":down:"
    replace: "↓"
  - trigger: ":deg:"
    replace: "°"
  - trigger: ":cmd:"
    replace: "⌘"
  - trigger: ":shift:"
    replace: "⇧"
  - trigger: ":ctrl:"
    replace: "⌃"
  - trigger: ":alt:"
    replace: "⌥"
  - trigger: ":opt:"
    replace: "⌥"
  - trigger: ":copyright:"
    replace: "©"
  - trigger: ":registered:"
    replace: "®"
  - trigger: ":trademark:"
    replace: "™"
  - trigger: ":flat:"
    replace: "♭"
  - trigger: ":sharp:"
    replace: "♯"
  - trigger: ":quarternote:"
    replace: "♩"
  - trigger: ":eighthnote:"
    replace: "♪"
  - trigger: ":schwa:"
    replace: "ə"
